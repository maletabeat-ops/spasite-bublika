/* ============ audio ============ */
let ac=null, master=null, noiseBuf=null, pourG=null, pourF=null, drainG=null, drainF=null;
function initAudio(){
  if(ac)return; try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=ac.createGain();master.gain.value=save.mute?0:.7;master.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const mk=(g,f)=>{const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;f.type='bandpass';f.Q.value=.8;s.connect(f);f.connect(g);g.connect(master);g.gain.value=0;s.start();};
  pourG=ac.createGain();pourF=ac.createBiquadFilter();mk(pourG,pourF);
  drainG=ac.createGain();drainF=ac.createBiquadFilter();mk(drainG,drainF);
}
function tone(f,dur,type='sine',vol=.25,slide=0,delay=0){
  if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
function boom(){if(!ac)return;const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;f.type='lowpass';f.frequency.setValueAtTime(1200,t);f.frequency.exponentialRampToValueAtTime(80,t+.6);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.8);tone(120,.5,'sine',.5,.3);}

function clearCells(set,make=[]){

    if(t.sp==='bomb'&&!t.fired){t.fired=1;boomAt(r,c);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(at(rr,cc)){const k=rr*COLS+cc;if(!seen.has(k)){seen.add(k);queue.push(k);}}}}

function mostCommon(){const cnt=new Array(5).fill(0);for(const row of board)for(const t of row)if(t&&t.t>=0&&!t.dying)cnt[t.t]++;return cnt.indexOf(Math.max(...cnt));}

let srcAcc=0, srcBlock=0, kingX=520, sayT=0, sayTxt='', T=0, endless=false, srcList=[], dragonSrc=false, elapsed=0;
function startLevel(i,isEndless=false){

  if(isEndless){L={hz:'sand',bg:'bg_chamber',rate:44,dur:999,types:5,src:[[9,1],[65,1]],king:370,say:'Сколько продержимся?'};}

function updatePlay(dt){
  elapsed+=dt;
  // pour
  if(!ended){
    let rate=L.rate*RATE_MUL*(1+.45*Math.sin(elapsed*.8))*(elapsed<1.2?elapsed/1.2:1);
    if(endless)rate=L.rate+elapsed*.9;
    srcAcc+=rate*dt; let blocked=0;
    while(srcAcc>=1){srcAcc-=1;const s=srcList[(Math.random()*srcList.length)|0];const x=s[0]+((Math.random()*2)|0);if(!spawnGrain(x,s[1])&&!spawnGrain(x,s[1]+1))blocked++;}
    srcBlock=blocked?srcBlock+dt:Math.max(0,srcBlock-dt);
  }
  // simulate (2 steps for liquids)
  simStep(); if(hz.liquid)simStep();
  // drain through open chutes
  let drainedNow=0;
  for(let c=0;c<COLS;c++){
    if(chute[c]<=0)continue; chute[c]-=dt;
    const x0=Math.ceil(c*TS/CS)+1, x1=Math.floor((c+1)*TS/CS)-1;

    for(let tries=0;tries<(x1-x0+1)*2&&budget>0;tries++){
      const x=x0+((Math.random()*(x1-x0+1))|0), k=(GH-1)*GW+x;
      if(g[k]){g[k]=0;budget--;drainedNow++;if(streams.length<500)streams.push({x:RX+x*CS+4,y:FLOOR,vy:120+Math.random()*80,c:gc[k],t:0});}
    }
  }

  grains=countGrains();

function draw(){
  const vw=innerWidth,vh=innerHeight;
  dpr=Math.min(devicePixelRatio||1,2);
  if(cv.width!==vw*dpr|0||cv.height!==vh*dpr|0){cv.width=vw*dpr|0;cv.height=vh*dpr|0;}
  scale=Math.min(vw/W,vh/H);ox=(vw-W*scale)/2;oy=(vh-H*scale)/2;
  buttons=[];
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1d1410';ctx.fillRect(0,0,cv.width,cv.height);
  const bgName=scene==='play'||scene==='pause'?L.bg:'bg_chamber';
  if(IMG[bgName]){const b=blurBg(bgName),s=Math.max(cv.width/b.width,cv.height/b.height);ctx.drawImage(b,(cv.width-b.width*s)/2,(cv.height-b.height*s)/2,b.width*s,b.height*s);}
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake*24;sy=(Math.random()-.5)*shake*24;}
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*(ox+sx*scale),dpr*(oy+sy*scale));
  ctx.save();rr(0,0,W,H,0);ctx.clip();
  if(IMG[bgName])ctx.drawImage(IMG[bgName],0,0,W,1290);
  if(scene==='play'||scene==='pause')drawPlay();
  else if(scene==='menu')drawMenu();
  else if(scene==='levels')drawLevels();
  ctx.restore();
  if(scene==='pause')drawPause();
}

/* ============ loop ============ */
let last=performance.now(), acc=0, paused=false;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(paused)return;
  tick(dt);draw();
}
function tick(dt){
  T+=dt;
  if(shake>0)shake=Math.max(0,shake-dt);
  if(sayT>0)sayT-=dt;
  if(scene==='play'){acc+=dt;let n=0;while(acc>=1/60&&n<3){updatePlay(1/60);acc-=1/60;n++;}if(n===3)acc=0;}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;if(p.t>p.life)parts.splice(i,1);}
  for(let i=streams.length-1;i>=0;i--){const p=streams[i];p.t+=dt;p.vy+=900*dt;p.y+=p.vy*dt;if(p.y>BY+TS*ROWS||p.t>1)streams.splice(i,1);}
  for(let i=floaters.length-1;i>=0;i--){floaters[i].t+=dt;if(floaters[i].t>1.3)floaters.splice(i,1);}
}
loadAll().then(()=>document.fonts&&document.fonts.load?Promise.all([document.fonts.load(`900 40px Rubik`),document.fonts.load(`800 20px Nunito`)]).catch(()=>{}):0).then(()=>requestAnimationFrame(frame));
